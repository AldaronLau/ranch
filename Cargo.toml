[package]
name = "ranch"
version = "0.6.0"
edition = "2024"
description = "Ranged integer types and math"
license = "Apache-2.0 OR BSL-1.0 OR MIT"
documentation = "https://docs.rs/ranch"
homepage = "https://github.com/AldaronLau/ranch/releases"
repository = "https://github.com/AldaronLau/ranch"
readme = "README.md"
keywords = ["ranged", "int", "const", "generics", "integers"]
categories = ["no-std", "no-std::no-alloc", "mathematics", "rust-patterns"]
include = [
    "/LICENSE_APACHE",
    "/LICENSE_BOOST",
    "/LICENSE_MIT",
    "/README.md",
    "/src/*",
    "/examples/*",
]
rust-version = "1.85"

[package.metadata.docs.rs]
all-features = true

[dependencies.arbitrary]
version = "1.4.2"
optional = true
default-features = false

[dependencies.as_repr]
version = "1.3.0"
default-features = false

[dependencies.bitflags]
version = "2.11.0"
optional = true
default-features = false

[dependencies.bytemuck]
version = "1.25.0"
optional = true
default-features = false

[dependencies.fastrand]
version = "2.3.0"
optional = true
default-features = false

[dependencies.serde_core]
version = "1.0.228"
optional = true
default-features = false

[dependencies.zeroize]
version = "1.8.2"
optional = true
default-features = false

[features]
"default" = ["full"]
"full" = []

"arbitrary" = ["arbitrary.v1"]
"arbitrary.v1" = ["dep:arbitrary"]
"bitflags" = ["bitflags.v2"]
"bitflags.v2" = ["dep:bitflags"]
"bytemuck" = ["bytemuck.v1"]
"bytemuck.v1" = ["dep:bytemuck"]
"fastrand" = ["fastrand.v2"]
"fastrand.v2" = ["dep:fastrand"]
"serde" = ["serde.v1"]
"serde.v1" = ["dep:serde_core"]
"zeroize" = ["zeroize.v1"]
"zeroize.v1" = ["dep:zeroize"]
