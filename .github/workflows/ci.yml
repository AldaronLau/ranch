name: tests
on:
  push:
    branches: ['v*']
  pull_request:
jobs:
  update:
    name: "Try updating dependencies"
    runs-on: ubuntu-slim
    steps:
      - uses: taiki-e/checkout-action@v1
      - name: Updating dependencies
        run: cargo update
  miri:
    name: "Miri"
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@v1
      - name: Install Miri
        run: |
          rustup toolchain install nightly --component miri
          rustup override set nightly
          cargo miri setup
      - name: Test with Miri (big-endian)
        run: cargo miri test --all --all-features --target s390x-unknown-linux-gnu
      - name: Test with Miri (little-endian)
        run: cargo miri test --all --all-features
  checks:
    name: "Checks"
    if: ${{ matrix.up }}
    needs: ${{ matrix.up }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        tc: [1.85.0, stable, beta, nightly]
        include:
        - tc: stable
          up: update
        - tc: beta
          up: update
        - tc: nightly
          up: update
        - os: ubuntu-latest
          cc: aarch64-linux-android i686-pc-windows-gnu i686-unknown-freebsd i686-unknown-linux-gnu wasm32-wasip1 wasm32-unknown-unknown x86_64-apple-darwin x86_64-unknown-redox x86_64-unknown-illumos
        - os: macos-latest
          cc: aarch64-apple-ios
    steps:
      - uses: taiki-e/checkout-action@v1
      - name: Install Rust
        run: |
          rustup set profile minimal
          rustup default ${{ matrix.tc }}
          rustup component add clippy rustfmt
      - if: ${{ matrix.up }}
        name: Running tests
        run: |
          cargo test --all
      - name: Check code formatting
        run: cargo fmt --check
      - name: Check doc generation succeeds
        run: cargo doc --all-features
      - name: Checking clippy for warnings
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      - if: ${{ matrix.cc }}
        name: Checking cross-compilation works
        run: |
          rustup target add ${{ matrix.cc }}
          for target in ${{ matrix.cc }}
          do
            cargo clippy --workspace --all-targets "--target=$target" -- -D warnings
            cargo clippy --workspace --all-targets --all-features "--target=$target" -- -D warnings
            cargo build "--target=$target"
            cargo build --all-features "--target=$target"
          done
